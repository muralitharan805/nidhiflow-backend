services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: nidhiflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nidhiflow}
      POSTGRES_USER: ${POSTGRES_USER:-vectordb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vector_admin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vectordb} -d $${POSTGRES_DB:-nidhiflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nidhiflow-network

  redis:
    image: redis:7.2-alpine
    container_name: nidhiflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nidhiflow-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
