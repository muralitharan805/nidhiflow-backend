name: Deploy to VPS via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Network Connection
        run: |
          echo "Pinging server..."
          ping -c 4 ${{ secrets.SERVER_HOST }} || true
          echo "Testing port..."
          nc -zv -w 5 ${{ secrets.SERVER_HOST }} ${{ secrets.SERVER_PORT }} || true
          
      - name: Execute SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git pull origin main || git pull origin master
            
            # Zero-compilation deployment pulling pre-built image from Docker Hub
            docker compose -f docker-compose.existing-infra.yml -f docker-compose.repo.yml up -d --pull always
            
            # Clean up dangling images to save server disk space
            docker image prune -f
